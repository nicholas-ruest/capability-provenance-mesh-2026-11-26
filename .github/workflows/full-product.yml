name: full-product-gate
on: [pull_request, workflow_dispatch]
permissions: {contents: read}
concurrency:
  group: full-product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      PLAYWRIGHT_BROWSERS_PATH: ~/.cache/ms-playwright
      DREAM_MACHINE_PRODUCER_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      DREAM_MACHINE_SELECTION_REPORT: ${{ github.workspace }}/selection-evidence/selection-report.json
      DREAM_MACHINE_EXECUTION_MAP: ${{ runner.temp }}/evidence/execution-map.json
      DREAM_MACHINE_EVIDENCE_DIR: ${{ runner.temp }}/evidence
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0}
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.91", components: rustfmt,clippy}
      - uses: actions/setup-node@v4
        with: {node-version: "24.11.1", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: taiki-e/install-action@v2
        with: {tool: cargo-deny}
      - run: sudo apt-get update && sudo apt-get install -y podman podman-compose
      - run: npm --prefix frontend ci && npx --prefix frontend playwright install --with-deps chromium
      - run: node scripts/dream-machine-gate-bundle.mjs .
      - name: Separate Rust source floor
        run: node scripts/dream-machine-rust-share.mjs .
      - name: Produce source-bound evidence
        run: scripts/verify-prototype.sh
      - name: Exact-head publication controller check
        run: node scripts/dream-machine-publication-gate.mjs --check . "$DREAM_MACHINE_EVIDENCE_DIR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capability-provenance-evidence-${{ github.sha }}
          path: ${{ runner.temp }}/evidence
          if-no-files-found: error
          retention-days: 30
