<svg xmlns="http://www.w3.org/2000/svg" width="960" height="300" viewBox="0 0 960 300" role="img" aria-labelledby="t2 d2"><title id="t2">Evidence lifecycle</title><desc id="d2">Denied effects remain isolated while repaired capabilities move to durable admission.</desc><rect width="960" height="300" rx="28" fill="#07111f"/><path d="M90 80H430Q480 80 480 130V160Q480 220 540 220H870" fill="none" stroke="#37d6c0" stroke-width="6" stroke-dasharray="18 12"><animate attributeName="stroke-dashoffset" values="60;0" dur="2s" repeatCount="indefinite"/></path><path d="M480 130V80H870" fill="none" stroke="#ff6b81" stroke-width="6" stroke-dasharray="18 12"><animate attributeName="stroke-dashoffset" values="0;60" dur="2s" repeatCount="indefinite"/></path><g font-family="system-ui" font-size="20" fill="#eef6ff" text-anchor="middle"><text x="90" y="58">Observe</text><text x="480" y="58">Decide</text><text x="870" y="58">Deny / no effect</text><text x="650" y="254">Repair → sign → retrieve</text></g><g fill="#0e2036" stroke-width="3"><circle cx="90" cy="80" r="32" stroke="#37d6c0"/><circle cx="480" cy="80" r="32" stroke="#7c5cff"/><circle cx="870" cy="80" r="32" stroke="#ff6b81"/><circle cx="870" cy="220" r="32" stroke="#37d6c0"/></g><circle cx="870" cy="220" r="40" fill="none" stroke="#37d6c0"><animate attributeName="opacity" values=".2;1;.2" dur="1.6s" repeatCount="indefinite"/></circle></svg>
