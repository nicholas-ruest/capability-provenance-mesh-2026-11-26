[workspace]
resolver = "2"
members = ["crates/*"]
[workspace.package]
edition = "2024"
license = "Apache-2.0 OR MIT"
rust-version = "1.100"
[workspace.dependencies]
cpm-contracts = { path = "crates/cpm-contracts" }
cpm-upstream-runtime = { path = "crates/cpm-upstream-runtime" }
serde = { version = "1.0.228", features = ["derive"] }
sha2 = "0.10.9"
thiserror = "2.0.17"
uuid = { version = "1.18.1", features = ["v4", "serde"] }
serde_json = "1.0.145"
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
[workspace.lints.clippy]
all = "deny"
pedantic = "warn"
