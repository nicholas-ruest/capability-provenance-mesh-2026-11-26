name: full-product-gate
on: [pull_request, workflow_dispatch]
permissions: {contents: read}
concurrency:
  group: full-product-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 240
    env:
      PLAYWRIGHT_BROWSERS_PATH: /tmp/dream-machine-ms-playwright
      DREAM_MACHINE_PLAYWRIGHT_ROOT: /tmp/dream-machine-playwright
      DREAM_MACHINE_UPSTREAM_ROOT: /tmp/dream-machine-upstreams
      DREAM_MACHINE_PRODUCER_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
      DREAM_MACHINE_SELECTION_REPORT: ${{ github.workspace }}/selection-evidence/selection-report.json
      DREAM_MACHINE_SELECTION_EVIDENCE: ${{ github.workspace }}/selection-evidence
      DREAM_MACHINE_EVIDENCE_DIR: /tmp/dream-machine-evidence
      DREAM_MACHINE_SEMANTIC_REVIEW: /tmp/dream-machine-semantic-review.md
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 0, ref: "${{ github.event.pull_request.head.sha || github.sha }}"}
      - name: Bind independent semantic review to exact head
        run: source_sha="$(git rev-parse HEAD)"; sed "s/__SOURCE_SHA__/$source_sha/g" selection-evidence/semantic-review.template.md > "$DREAM_MACHINE_SEMANTIC_REVIEW"
      - run: source_sha="$(git rev-parse HEAD)"; grep -F "$source_sha" "$DREAM_MACHINE_SEMANTIC_REVIEW"
      - uses: dtolnay/rust-toolchain@stable
        with: {toolchain: "1.100.0", components: rustfmt,clippy}
      - uses: actions/setup-node@v4
        with: {node-version: "24.21.0", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: taiki-e/install-action@v2
        with: {tool: cargo-deny}
      - run: sudo apt-get update && sudo apt-get install -y podman podman-compose python3-venv
      - name: Install locked browser runner outside checkout
        run: |
          npm install --prefix "$DREAM_MACHINE_PLAYWRIGHT_ROOT" --no-save @playwright/test@1.56.1
          "$DREAM_MACHINE_PLAYWRIGHT_ROOT/node_modules/.bin/playwright" install --with-deps chromium
      - run: node scripts/dream-machine-gate-bundle.mjs .
      - name: Verify governed publisher without network
        run: |
          tests/publication/publisher-route.test.sh
          tests/publication/negative-control.sh
      - name: Separate Rust source floor
        run: node scripts/dream-machine-rust-share.mjs .
      - name: Independent semantic review required
        run: source_sha="$(git rev-parse HEAD)"; test -s "$DREAM_MACHINE_SEMANTIC_REVIEW" && grep -F "$source_sha" "$DREAM_MACHINE_SEMANTIC_REVIEW"
      - name: Produce source-bound evidence
        run: scripts/verify-prototype.sh
      - name: Exact-head publication controller check
        run: node scripts/dream-machine-publication-gate.mjs --check . "$DREAM_MACHINE_EVIDENCE_DIR"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: capability-provenance-evidence-${{ github.event.pull_request.head.sha || github.sha }}
          path: /tmp/dream-machine-evidence
          if-no-files-found: error
          retention-days: 30
