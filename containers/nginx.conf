server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  location / { try_files $uri /index.html; }
  location /api/ { proxy_pass http://api:8080; proxy_set_header X-Forwarded-Proto $scheme; proxy_set_header X-Request-Id $request_id; }
  location = /healthz { access_log off; return 200 "ok\n"; add_header Content-Type text/plain; }
}
