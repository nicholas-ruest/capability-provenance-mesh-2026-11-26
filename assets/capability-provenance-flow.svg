<svg xmlns="http://www.w3.org/2000/svg" width="960" height="320" viewBox="0 0 960 320" role="img" aria-labelledby="t d"><title id="t">Capability provenance flow</title><desc id="d">A bundle advances through evidence, quarantine, policy, signature, and audit.</desc><rect width="960" height="320" rx="28" fill="#07111f"/><defs><linearGradient id="g" x1="0" x2="1"><stop stop-color="#37d6c0"/><stop offset="1" stop-color="#7c5cff"/></linearGradient></defs><path d="M100 160H860" stroke="#213a55" stroke-width="12" stroke-linecap="round"/><path d="M100 160H860" stroke="url(#g)" stroke-width="5" stroke-linecap="round" stroke-dasharray="40 28"><animate attributeName="stroke-dashoffset" from="68" to="0" dur="2.4s" repeatCount="indefinite"/></path><g fill="#0e2036" stroke="#55e0c8" stroke-width="3"><circle cx="100" cy="160" r="48"/><circle cx="290" cy="160" r="48"/><circle cx="480" cy="160" r="48"/><circle cx="670" cy="160" r="48"/><circle cx="860" cy="160" r="48"/></g><g fill="#dffcf7" font-family="system-ui" font-size="18" text-anchor="middle"><text x="100" y="166">Bundle</text><text x="290" y="166">Evidence</text><text x="480" y="166">Quarantine</text><text x="670" y="166">Policy</text><text x="860" y="156">Signed</text><text x="860" y="178">Audit</text></g><circle cx="100" cy="160" r="58" fill="none" stroke="#7c5cff" stroke-width="3"><animate attributeName="r" values="50;68;50" dur="2.4s" repeatCount="indefinite"/><animate attributeName="opacity" values=".9;0;.9" dur="2.4s" repeatCount="indefinite"/></circle></svg>
